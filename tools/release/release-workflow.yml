# Stratus release pipeline (M8.12 - R-1.1/1.2/2.1).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Build production bundle
        run: deno task feles-build build

      - name: Smoke tests
        run: deno task test:smoke

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Create checksums + update manifest
        run: |
          pwsh -File tools/release/make-checksums.ps1 -OutDir _dist/release -StageDir _dist/bin/floorp
          pwsh -File tools/release/make-update-manifest.ps1 -OutDir _dist/release

      - name: Sign installer (production cert from secrets)
        if: ${{ secrets.CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          pwsh -File tools/release/make-installer.ps1 -OutDir _dist/release -StageDir _dist/bin/floorp
          pwsh -File tools/signing/sign.ps1 -Binary "_dist/release/stratus-browser-installer.exe"

      - name: Package installer without signing (unsigned fallback)
        if: ${{ secrets.CERTIFICATE_BASE64 == '' }}
        run: pwsh -File tools/release/make-installer.ps1 -OutDir _dist/release -StageDir _dist/bin/floorp

      - name: Recompute checksums after signing
        run: pwsh -File tools/release/make-checksums.ps1 -OutDir _dist/release -StageDir _dist/bin/floorp

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stratus-release
          path: |
            _dist/release/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            _dist/release/*
          generate_release_notes: true

name: Stratus Windows Build

'on':
  push:
    branches:
      - stratus-runtime-0.2.0

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Windows x64 (Stratus)
    uses: ./.github/workflows/wrapper-build-windows.yml
    with:
      debug: false
      pgo: false
      MOZ_BUILD_DATE: ''
    secrets: inherit

  collect:
    name: Push artifact to output branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stratus-runtime-0.2.0
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Commit artifact
        run: |
          git switch --orphan stratus-runtime-build-output 2>/dev/null || git switch stratus-runtime-build-output
          git rm -rq --cached --ignore-unmatch _artifacts 2>/dev/null || true
          git add _artifacts
          git -c user.name=Stratus -c user.email=stratus@localhost commit -m "build: windows x64 artifacts (stratus)" --allow-empty
          git branch -M stratus-runtime-build-output
          git push origin stratus-runtime-build-output --force
      - name: Print artifact names
        run: find _artifacts -maxdepth 2 -type f | head -50

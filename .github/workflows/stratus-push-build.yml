name: Stratus Windows Build

'on':
  push:
    branches:
      - stratus-runtime-0.2.0

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Windows x64 (Stratus)
    uses: ./.github/workflows/wrapper-build-windows.yml
    with:
      debug: false
      pgo: false
      MOZ_BUILD_DATE: ''
    secrets: inherit

  collect:
    name: Push artifact to output branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stratus-runtime-0.2.0
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit artifact
        run: |
          git switch -c stratus-runtime-build-output 2>/dev/null || git switch stratus-runtime-build-output
          git rm -rq --cached --ignore-unmatch artifacts 2>/dev/null || true
          mkdir -p artifacts
          shopt -s nullglob
          for f in artifacts/*/{*.zip,*.tar,*.tar.gz}; do
            [ -f "$f" ] && cp "$f" artifacts/ 2>/dev/null || true
          done
          git add artifacts
          git -c user.name=Stratus -c user.email=stratus@localhost commit -m "build: windows x64 artifacts (stratus)" --allow-empty
          git push origin stratus-runtime-build-output

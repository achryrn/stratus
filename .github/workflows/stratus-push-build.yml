name: Stratus Windows Build

'on':
  push:
    branches:
      - stratus-runtime-0.2.0
    paths-ignore:
      - '.github/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Windows x64 (Stratus)
    uses: ./.github/workflows/wrapper-build-windows.yml
    with:
      debug: false
      pgo: false
      MOZ_BUILD_DATE: ''
    secrets: inherit

  collect:
    name: Push artifact to output branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stratus-runtime-0.2.0
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Split large files below 100MB
        run: |
          find _artifacts -type f -size +90M -print0 | while IFS= read -r -d '' f; do
            d=$(dirname "$f")
            b=$(basename "$f")
            cd "$d"
            split -d -a 3 -b 90m "$b" "$b."
            rm "$b"
          done
      - name: Commit artifact
        run: |
          git switch --orphan stratus-runtime-build-output 2>/dev/null || git switch stratus-runtime-build-output
          git rm -rqf --cached . 2>/dev/null || true
          git add _artifacts
          git -c user.name=Stratus -c user.email=stratus@localhost commit -m "build: windows x64 artifacts (stratus)" --allow-empty
          git branch -M stratus-runtime-build-output
          git push origin stratus-runtime-build-output --force 2>&1 | tail -3
      - name: Print artifact manifest
        run: find _artifacts -maxdepth 2 | head -60